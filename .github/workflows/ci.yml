name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: |
          test -f actions/rust-ci/action.yml
          test -f actions/node-ci/action.yml
          test -f actions/sbom/action.yml
          if grep -R 'uses: .*@v[0-9]' actions .github; then
            echo "mutable action reference found" >&2
            exit 1
          fi
