name: Secure Node CI
description: Install deterministically, test, and build a Node repository
inputs:
  node-version:
    description: Node version
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - shell: bash
      run: npm ci --ignore-scripts
    - shell: bash
      run: npm test
    - shell: bash
      run: npm run build --if-present
